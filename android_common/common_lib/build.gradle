import java.util.regex.Pattern

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

apply from: "../config.gradle"
android {
    buildToolsVersion android.buildToolsVersion
    compileSdkVersion android.compileSdkVersion

    defaultConfig {
        minSdkVersion android.minSdkVersion
        targetSdkVersion android.targetSdkVersion
        versionCode 1
        versionName "1.0"

    }

    flavorDimensions "phone"
    productFlavors {
        xiaomi {
            dimension "phone"
        }

        oppo {
            dimension "phone"
        }

        def taskRequest = getGradle().getStartParameter().getTaskRequests()
        def args = taskRequest.isEmpty() ? new ArrayList() : taskRequest.get(0).getArgs()
        def firstArg = args.isEmpty() ? "" : args.get(0).toString()
        println("[CONFIG] args: " + firstArg)
        if (!firstArg.isEmpty()) {
            def p = Pattern.compile("[a-zA-Z\\d:]*(Xiaomi|Oppo)(Debug|Release)[a-zA-Z\\d]*")
            def m = p.matcher(firstArg)
            if (m.matches()) {
                def pFlavor = m.group(1)
                def pBuildType = m.group(2)
                println("[CONFIG] pFlavor: " + pFlavor + ", pBuildType: " + pBuildType)
                if (!pFlavor.isEmpty() && !pBuildType.isEmpty()) {
                    libraryVariants.all { variant ->
                        def flavor = variant.getFlavorName()
                        def buildType = variant.getBuildType().getName()
                        if (pFlavor.equalsIgnoreCase(flavor) && pBuildType.equalsIgnoreCase(buildType)) {
                            project.ext.config.each { cfg ->
                                def key = "${cfg.key}"
                                def value = "${cfg.value[flavor]}"
                                println("[CONFIG] key: " + key + ", value: " + value)
                                variant.buildConfigField "String", key, "\"${value}\""
                            }
                        }
                    }
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {

        }
    }
    buildFeatures {
        viewBinding = true
    }


}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    api fileTree(dir: 'libs', include: ['*.jar'])

    api "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    api 'androidx.core:core-ktx:1.6.0'
    api 'androidx.fragment:fragment-ktx:1.3.6'
    api "androidx.appcompat:appcompat:1.3.1"
    api "androidx.constraintlayout:constraintlayout:2.1.0"
    api "com.google.android.material:material:1.4.0"
    api "androidx.recyclerview:recyclerview:1.2.1"

    api "androidx.lifecycle:lifecycle-viewmodel-ktx:2.3.1"
    api "androidx.lifecycle:lifecycle-livedata-ktx:2.3.1"

    // third component
    api "com.wang.avi:library:2.1.3"
    api "pub.devrel:easypermissions:3.0.0"
    api "com.github.niorgai:StatusBarCompat:2.3.1"
    api "com.github.CymChad:BaseRecyclerViewAdapterHelper:3.0.4"

    // refresh view
    api  'com.scwang.smart:refresh-layout-kernel:2.0.3'      //核心必须依赖
    api  'com.scwang.smart:refresh-header-classics:2.0.3'    //经典刷新头
    api  'com.scwang.smart:refresh-header-radar:2.0.3'       //雷达刷新头
    api  'com.scwang.smart:refresh-header-falsify:2.0.3'     //虚拟刷新头
    api  'com.scwang.smart:refresh-header-material:2.0.3'    //谷歌刷新头
    api  'com.scwang.smart:refresh-header-two-level:2.0.3'   //二级刷新头
    api  'com.scwang.smart:refresh-footer-ball:2.0.3'        //球脉冲加载
    api  'com.scwang.smart:refresh-footer-classics:2.0.3'    //经典加载

    api "io.reactivex.rxjava2:rxandroid:2.1.1"
    api "io.reactivex.rxjava2:rxjava:2.2.9"


    // toasty
    api 'com.github.GrenderG:Toasty:1.5.0'

    api 'com.wuhenzhizao:titlebar:1.2.0'


    testImplementation test.junit
    // Assertions
    androidTestImplementation androidTest.junit
    androidTestImplementation androidTest.truth

    implementation 'com.android.tools.build:gradle:7.1.2'
}
